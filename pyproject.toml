[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "xaidr"
dynamic = ["version"]
description = "Standalone, local-first security sensor for AI agents — prompt-injection, jailbreak, DLP, and A2A-protocol scanning. No backend, no account, zero required dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Delphi Security Inc." }]
keywords = [
    "security",
    "ai-agents",
    "a2a",
    "llm",
    "prompt-injection",
    "jailbreak",
    "ai-security",
    "dlp",
    "guardrails",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    # Redundant with the PEP 639 `license = "Apache-2.0"` expression above, and
    # deprecated by that PEP — kept because scanners that only read classifiers
    # (and not `License-Expression`) otherwise report this package as unlicensed.
    # PyPI only rejects the legacy `License` field alongside `License-Expression`;
    # a `License ::` classifier alongside it is accepted.
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Zero required runtime dependencies — `pip install xaidr` pulls in nothing.
dependencies = []

[project.optional-dependencies]
# HTTP-intercept feature (protect_http / ProtectedHttpClient). Only needed if you
# wrap an httpx.Client: `pip install xaidr[http]`.
http = ["httpx>=0.24"]
# W3C Trace Context parent resolution (READING HALF only): parse an inbound
# `traceparent` header / read an active OTel span so scans carry the host's
# parent as additive telemetry metadata. opentelemetry-api ONLY — never the SDK,
# never a TracerProvider/exporter. Keeps zero required deps. `pip install xaidr[trace]`.
trace = ["opentelemetry-api>=1.20"]
# Optional ML detection signal for the rules-silent band (scanner/nano.py).
# OFF unless BOTH installed and explicitly enabled via Sensor(enable_nano=True).
# onnxruntime + tokenizers only — deliberately no torch, no transformers, and
# nothing that loads a pickle: the artifact is a hash-pinned ONNX file and the
# tokenizer is data. `pip install xaidr[nano]`.
#
# THE RUNTIME IS NOT PINNED WITH `==`, AND THAT IS A DECISION, NOT AN OVERSIGHT.
# The hash pin fixes which bytes load; it does not fix what they compute, because
# an int8/int4 graph is executed by onnxruntime kernels that change between
# releases. Measured on the 2000-prompt acceptance sample, same artifact and same
# code: 35/2000 = 1.75% on onnxruntime <=1.23 and 67/2000 = 3.35% on 1.26-1.29.
# The runtime nearly doubles the published false-positive rate. An `==` pin was
# considered and rejected for three reasons: the acceptance record names NO
# runtime version, so there is no accepted version to pin to; an exact pin in a
# library's extra becomes a resolver conflict in every adopter environment that
# already has onnxruntime; and it would freeze a security package out of
# onnxruntime's own security updates. The control instead is that the figure is
# published as a RANGE with a runtime beside each end (nano.MEASURED_FP_RANGE),
# the full measurement environment is recorded (nano.MEASURED_IN), every loaded
# instance records the runtime actually in use (DelphiNano.onnxruntime_version),
# and a runtime outside the measured ranges means re-running the battery.
#
# THE FLOORS BELOW ARE MEASURED, NOT ASSERTED. Both previous floors were wrong:
# they were the oldest versions that existed, not the oldest that work. Each was
# installed against the pinned artifact and the failure observed:
#
#   onnxruntime 1.17.3   FAILS  Load model ... model_load_utils.h:56 — the
#                               graph's opset is newer than this runtime accepts
#   onnxruntime 1.18.1   FAILS  Fatal error: com.microsoft:GatherBlockQuantized
#   onnxruntime 1.19.2   FAILS  (-1) is not a registered function/op — the INT4
#                               block-quantized embedding gather does not exist
#                               before 1.20
#   onnxruntime 1.20.1   LOADS  and scores
#
#   tokenizers 0.15.2    FAILS  data did not match any variant of untagged enum
#                               PyPreTokenizerTypeWrapper at line 2265 column 3
#   tokenizers 0.19.1    FAILS  data did not match any variant of untagged enum
#                               ModelWrapper at line 2580788 column 3
#   tokenizers 0.20.3    LOADS  and scores
#
# So `>=1.17` and `>=0.15` both promised an install that cannot load the model at
# all: a resolver honouring the old floors produced a hard failure at first scan,
# not a degraded one. Nano fails OPEN, so that failure was silent.
nano = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.24", "huggingface-hub>=0.23"]
# Local YAML policy loading (local_policy.py) — parses a `./xaidr-policy.yaml`
# via `yaml.safe_load`. Referenced by the code's own error message
# ("Install with: pip install xaidr[policy]"). `pip install xaidr[policy]`.
policy = ["PyYAML>=6"]
# OTelReporter (reporters.py) — emits each security event as an OTel log record
# through `opentelemetry._logs`. Referenced by the reporter's own error message
# ("Install with: pip install xaidr[otel]"). Uses the SAME opentelemetry-api the
# [trace] extra pins (matched version, no conflicting pin); this extra is named
# for the reporter feature. To actually export to a backend the user also
# configures a LoggerProvider from the OpenTelemetry SDK (installed separately
# by the user — this extra deliberately stays API-only, no SDK pin); absent one,
# emit is a safe no-op. `pip install xaidr[otel]`.
otel = ["opentelemetry-api>=1.20"]
# LangChain 1.0 middleware (integrations/langchain.py) — imports
# `langchain.agents.middleware` + `langchain_core.messages`. Referenced by the
# middleware's own error message ("Install with: pip install 'xaidr[langchain]'").
# `pip install xaidr[langchain]`.
langchain = ["langchain>=1.0", "langchain-core>=1.0"]
# CrewAI hooks + guardrail (integrations/crewai.py) — imports `crewai.hooks`.
# Referenced by the integration's own error message ("Install with: pip install
# 'xaidr[crewai]'"). The floor is 1.0 because `crewai.hooks` (the
# before_tool_call registry this integrates with) does not exist before it; the
# integration reports a build without it as unpatchable rather than falling back
# to patching `BaseTool.run`, which the agent tool path does not go through.
# `pip install xaidr[crewai]`.
crewai = ["crewai>=1.0"]
# Haystack Agent hooks (integrations/haystack.py) — imports `haystack.hooks` and
# `haystack.components.agents`. Referenced by the integration's own error message
# ("Install with: pip install 'xaidr[haystack]'").
#
# THE FLOOR IS 3.0 BECAUSE THE SEAM DOES NOT EXIST BEFORE IT, not because 3.0 is
# the newest. `haystack.hooks` — the Agent hook points this integration binds to
# (`before_run`, `before_tool`, `after_run`) — was added in haystack-ai 3.0.
# haystack-ai 2.x HAS an `Agent`, so a 2.x install would not fail at import; it
# would fail inside `Agent.__init__` with an unrelated TypeError about an
# unexpected `hooks` keyword. The integration therefore checks for the hook
# points explicitly and reports a build without them as unpatchable, rather than
# falling back to patching `Tool.invoke` — which is reachable but sees the
# POST-state-injection arguments rather than the model's, and has no way to
# refuse a call without recording it as having run.
#
# The distribution is `haystack-ai`; the import name is `haystack`.
# `pip install 'xaidr[haystack]'`.
haystack = ["haystack-ai>=3.0"]
# Dev/test tooling — the base pytest regression suite. `pip install xaidr[dev]`.
# tests/test_real_frameworks.py additionally exercises the REAL langchain,
# crewai and haystack when they are present, and skips cleanly when they are
# not — install `xaidr[dev,langchain]` / `xaidr[dev,crewai]` /
# `xaidr[dev,haystack]` to run those.
#
# hatchling is here as a TEST dependency, not a build one — it is already in
# `build-system.requires`, but that resolves into an isolated build env the test
# session never sees. tests/test_sdist_contents.py builds a real sdist and reads
# the tarball, which is the only way to check the thing that actually broke: the
# sdist include list shipped no pool and no regenerator while its LISTING showed
# five pool directories. Without hatchling in the test env that check skips, and
# a skipped packaging check is indistinguishable from a passing one.
dev = ["pytest", "hatchling>=1.18"]

[project.urls]
Homepage = "https://github.com/delphisecurity/xaidr"
Repository = "https://github.com/delphisecurity/xaidr"

# --- Version: single source of truth = xaidr/__init__.py __version__ ----------
[tool.hatch.version]
path = "xaidr/__init__.py"

# --- Wheel: ship the `xaidr` package + ALL subpackages + rules data files -----
# Distribution name is `xaidr`; the import name is also `xaidr`. The rules/*.json
# are loaded by filesystem path at runtime (l1.py / normalizer.py), so they MUST
# ship inside the package. Hatchling includes ALL files under the package
# directory (including the non-Python rules/*.json) by default — do NOT add a
# redundant force-include, it triggers a "duplicate path" build error. Verified
# empirically by installing the built wheel in a clean venv (338 rules load).
[tool.hatch.build.targets.wheel]
packages = ["xaidr"]

# --- Sdist: the package, the pools, and the scripts that regenerate figures ---
#
# THE SDIST SHIPS THE CORPORA AND THE REGENERATORS. THIS IS A DECISION.
#
# It used to be `include = ["xaidr", "README.md", "pyproject.toml"]`, and that
# list is wrong in two separate ways.
#
# 1. IT SHIPPED NO POOL AND NO SCRIPT. Every figure this project publishes —
#    167 of 186, 165 of 277, 265 of 277, the nano false-positive range, the ASI
#    battery baseline — is a measurement over a committed pool, made by a script
#    in scripts/. U-1 requires each of those to have a regenerator. With this
#    list, the only place a regenerator could run was a git clone; the published
#    artifact could reproduce nothing it claimed. "Verified from the built
#    artifact" was therefore never available to say about any of them.
#
# 2. IT LOOKED LIKE IT DID. These patterns are gitignore-style, so a bare
#    `README.md` — no slash — matches at ANY DEPTH. The built sdist listed
#
#        xaidr-1.18.0/asi_battery/README.md
#        xaidr-1.18.0/benign_a2a/README.md
#        xaidr-1.18.0/benign_longform/README.md
#        xaidr-1.18.0/benign_toolcalls/README.md
#        xaidr-1.18.0/heldout/README.md
#
#    so every pool directory APPEARED in the listing while holding none of its
#    data. Reading that listing is how the 1.16.0 body concluded the pools were
#    present "measured from the built files". The check did not fail; it passed
#    on evidence that meant nothing.
#
# Both halves of the fix matter. The directories are named, AND every pattern is
# anchored with a leading `/` so no pattern can ever again match at a depth it
# was not written for.
#
# COST, MEASURED: +2.7 MB uncompressed (tests 1.8M, pools 588K, scripts 288K),
# sdist only. The WHEEL is unchanged and deliberately so — `pip install xaidr`
# unpacks the wheel into site-packages for every user, and none of them wants a
# 190-case benign tool-call corpus on their import path. The sdist is the only
# published artifact that can carry this, which is the whole argument for
# putting it there.
#
# WHAT THIS DOES NOT REPLACE. `scripts/corpus_diff.py` takes its pools from
# `--pools` (a clone of the tag) and its CODE from whichever interpreter runs
# the dump, on purpose: checking out each version and running its own pools
# compares two pools as well as two sensors. Shipping the pools here does not
# change that separation. It changes where the pool half can come from — an
# `sdist` downloaded from PyPI, not only a GitHub clone.
#
# DISCLOSURE: asi_battery/attacks.jsonl and heldout/attacks.jsonl are attack
# corpora. They are already public — the repository is public and the README
# links into it by path — so this publishes nothing new. It makes the README's
# "the per-entry detail ... ships with the repository" true of the distribution
# as well.
#
# _phase1/ is dev oracles/verification scaffolding — kept in the repo, kept OUT
# of the distribution.
[tool.hatch.build.targets.sdist]
include = [
    # the package itself
    "/xaidr",
    # the regenerators U-1 requires, and the suite that gates them
    "/scripts",
    "/tests",
    "/repro_audit.py",
    # the committed pools every published figure is measured over
    "/asi_battery",
    "/benign_a2a",
    "/benign_longform",
    "/benign_toolcalls",
    "/heldout",
    # prose that states the figures, so a reader of the sdist can find the claim
    # the regenerator answers
    "/docs",
    "/README.md",
    "/BENCHMARKS.md",
    "/THREAT_MODEL.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/pyproject.toml",
]
exclude = ["_phase1", "**/__pycache__", "*.pyc", "**/.pytest_cache"]
