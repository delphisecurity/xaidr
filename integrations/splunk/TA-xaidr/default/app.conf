#
# app.conf - TA-xaidr
#
# Technology Add-on for xaidr agent-security telemetry.
# Configuration only: no scripts, no inputs, no custom commands, no bin/ directory.
#

[id]
name = TA-xaidr
version = 1.1.0

[install]
is_configured = false
state = enabled
build = 2

[package]
id = TA-xaidr
# Set true rather than deleted. Splunk's default is already true, so deleting the
# key would satisfy Splunkbase too -- but this key was previously false on
# purpose, and an absent key records no decision.
#
# Do not "fix" this back to false. AppInspect's check_for_updates_disabled warns
# on it, and that warning is expected: the check is tagged private_app /
# private_classic / private_victoria and asks for false on "private apps not
# uploaded to Splunkbase". This add-on is uploaded to Splunkbase, where a hosted
# app has to be able to offer updates, so the check's own premise excludes us.
# Measured, not assumed -- AppInspect 4.3.1 emits that warning for true AND for
# the key being absent, so the warning is unavoidable at any Splunkbase-legal
# value and is not a reason to prefer deletion. It carries no cloud tag, so the
# cloud tag set stays at 0 warnings either way.
check_for_updates = true

[ui]
is_visible = false
label = xaidr Technology Add-on

[launcher]
author = xaidr project
description = Sourcetypes and field extractions for xaidr agent-security telemetry (native JSON and openA2A gen_ai.security.* shapes), targeting xaidr schema 0.2.0. Parsing only; ships no inputs and no code.
version = 1.1.0

# No [triggers] stanza. props.conf, transforms.conf and eventtypes.conf are
# Splunk-defined confs with their own reload behaviour; reload.<conf> is for
# custom conf files only, and declaring it for these is an AppInspect failure.
