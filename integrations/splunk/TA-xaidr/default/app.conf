#
# app.conf - TA-xaidr
#
# Technology Add-on for xaidr agent-security telemetry.
# Configuration only: no scripts, no inputs, no custom commands, no bin/ directory.
#

[id]
name = TA-xaidr
version = 1.1.0

[install]
is_configured = false
state = enabled
build = 2

[package]
id = TA-xaidr
check_for_updates = false

[ui]
is_visible = false
label = xaidr Technology Add-on

[launcher]
author = xaidr project
description = Sourcetypes and field extractions for xaidr agent-security telemetry (native JSON and openA2A gen_ai.security.* shapes), targeting xaidr schema 0.2.0. Parsing only; ships no inputs and no code.
version = 1.1.0

# No [triggers] stanza. props.conf, transforms.conf and eventtypes.conf are
# Splunk-defined confs with their own reload behaviour; reload.<conf> is for
# custom conf files only, and declaring it for these is an AppInspect failure.
