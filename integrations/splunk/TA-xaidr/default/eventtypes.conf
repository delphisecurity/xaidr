#
# eventtypes.conf - TA-xaidr
#
# Named event classes so a search or dashboard states its intent once.
#
# ─────────────────────────────────────────────────────────────────────────────
# SEPARATE EVENT TYPES, NOT A SHARED ONE, AND WHY
# ─────────────────────────────────────────────────────────────────────────────
# Schema 0.2.0 puts two genuinely different records under one sourcetype:
#
#   scan             a verdict on a message. Has action, score, category, rules.
#   circuit_breaker  a state transition of the sensor. Has none of those. It has
#                    a transition, a reason and some counts.
#
# The obvious move is one shared class per sourcetype and let searches filter.
# That is wrong here, for a reason specific to this data: a breaker record does
# not merely have DIFFERENT fields, it has ABSENT ones, and absence is how this
# schema encodes "unknown". A search written for scans that now matches breaker
# records does not fail loudly. It quietly changes its own denominator. `stats
# count by xaidr_category` grows a blank row; `avg(xaidr_score)` is computed
# over a population that includes records which never had a score; a panel
# counting events per agent starts counting circuit flaps alongside verdicts.
# Every one of those reads as a data problem rather than a search problem, and
# in a SIEM the person who notices is the person handling an incident.
#
# So the verdict-shaped classes below all state xaidr_event_type=scan. That is
# belt AND braces with the xaidr_is_* fields in props.conf, which are keyed on
# xaidr_action and so already cannot fire on a record that has none:
#
#   * the EVAL is keyed on the FACT (no action means no verdict), which stays
#     correct for pre-0.2.0 events that carry no event_type to test;
#   * the eventtype states the DISCRIMINATOR, which is explicit, greppable, and
#     does not ask a reader to reason about how Splunk propagates nulls through
#     a comparison in order to convince themselves a panel is right.
#
# Neither alone is enough. The EVAL alone leaves `eventtype=xaidr` panels
# silently mixed; the discriminator alone breaks on pre-0.2.0 data.
#
# xaidr_breaker_transition is NOT used as the discriminator even though only
# breaker records have it. Testing for the presence of a payload field to infer
# a record's type is exactly the inference the event_type attribute was added to
# make unnecessary.
#
# `xaidr` remains as the one deliberately shared class, for "all telemetry from
# this sensor" — volume, health, ingestion checks. It is the only one that
# should match both kinds, and it says so.
#
# DELIBERATELY UNTAGGED. There is no tags.conf in this add-on: tags are how an
# event type joins a CIM data model, and this add-on does not claim CIM
# compliance. See README.md, "Not CIM-mapped, and why".
#

# ── the shared one, and the only shared one ──────────────────────────────────
[xaidr]
search = sourcetype=xaidr:json OR sourcetype=xaidr:openA2A

# ── by record type ───────────────────────────────────────────────────────────
# Both now work on BOTH sourcetypes. Under schema 0.1.0 the mapped shape carried
# no discriminator at all, so xaidr_circuit_breaker had to be native-only and
# matched raw text; a breaker record in the openA2A shape was unreachable
# because the mapper had already thrown its identity away.
[xaidr_scan]
search = (sourcetype=xaidr:json OR sourcetype=xaidr:openA2A) xaidr_event_type=scan

[xaidr_circuit_breaker]
search = (sourcetype=xaidr:json OR sourcetype=xaidr:openA2A) xaidr_event_type=circuit_breaker

# The alertable half. A trip means the sensor stopped trusting its own traffic;
# a close means someone or something released it.
[xaidr_circuit_breaker_trip]
search = eventtype=xaidr_circuit_breaker xaidr_breaker_transition=trip

[xaidr_circuit_breaker_close]
search = eventtype=xaidr_circuit_breaker xaidr_breaker_transition=close

# ── verdict-shaped classes: scans only, stated ───────────────────────────────
# A catch as the project defines it: blocked OR flagged. Both emit a scored,
# logged event.
[xaidr_catch]
search = eventtype=xaidr_scan xaidr_is_catch=1

[xaidr_blocked]
search = eventtype=xaidr_scan xaidr_action=blocked

# Halting verdicts: a block and an approval gate both stop autonomous execution.
[xaidr_halting]
search = eventtype=xaidr_scan xaidr_is_halting=1

# The sensor caught an internal fault and failed OPEN. The verdict is "allowed"
# with reduced assurance, which is NOT the same as a clean allow.
[xaidr_degraded]
search = eventtype=xaidr_scan xaidr_degraded=true

# A verdict the optional ML signal contributed to. xaidr_nano_calibrated is
# false on every one of these by construction; do not rank by xaidr_nano_score.
[xaidr_nano_signal]
search = eventtype=xaidr_scan xaidr_nano_score=*

# An action carrying a resolved delegation principal (set_origin / origin_scope).
[xaidr_on_behalf_of]
search = eventtype=xaidr_scan xaidr_on_behalf_of=*

# ── correlation ──────────────────────────────────────────────────────────────
# Any record carrying W3C trace context, either kind. Trace correlation is the
# one dimension where mixing the two record types is the point: it is how a
# breaker trip gets tied to the requests that caused it.
[xaidr_traced]
search = (sourcetype=xaidr:json OR sourcetype=xaidr:openA2A) xaidr_trace_id=*
