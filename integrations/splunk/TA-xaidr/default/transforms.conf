#
# transforms.conf - TA-xaidr
#
# Search-time field extractions for the openA2A shape, referenced by the
# REPORT-xaidr_openA2A chain in props.conf.
#
# WHY THESE EXIST WHEN KV_MODE=json IS ALREADY ON. In the openA2A shape every
# key is a flat OTel attribute name containing literal dots:
#
#   {"gen_ai.security.detection.action":"blocked", ...}
#
# Splunk's JSON extractor names nested keys by their path and joins the parts
# with '.'. A flat key that already contains dots is therefore the one input
# where the resulting field name is not something this add-on can state with
# confidence, and it is also the case that makes spath awkward for an analyst
# (spath reads '.' as descent). These regexes sidestep the question entirely by
# matching the raw text, so xaidr_action exists no matter how the extractor
# names things. KV_MODE=json stays on so the full document is still available
# under whatever names it does produce.
#
# All of these are search-time. None writes to the index.
#
# Regex notes:
#   * '.' inside a key name is escaped, so gen_ai.security... cannot match
#     gen_aiXsecurity...
#   * String values use ([^"]*) - none of these fields can contain a quote:
#     they are enum values, ids, hex hashes and hyphenated names, all emitted
#     by the mapper rather than copied from scanned content. Raw content never
#     reaches telemetry; it is hashed first.
#   * Numeric values use (-?[0-9]+(?:\.[0-9]+)?) so a score of 0 and a score of
#     0.88 both match and nothing else on the line does.
#   * Booleans are captured as the literal true/false text.

# ── envelope ─────────────────────────────────────────────────────────────────
[xaidr_openA2A_envelope]
REGEX = "gen_ai\.security\.event_id"\s*:\s*"([^"]*)"
FORMAT = xaidr_event_id::$1

[xaidr_openA2A_schema_version]
REGEX = "gen_ai\.security\.schema_version"\s*:\s*"([^"]*)"
FORMAT = xaidr_schema_version::$1

# scan | circuit_breaker. New in schema 0.2.0 and the single most important
# attribute on the record: before it existed the only way to tell a breaker
# transition from a scan was to notice which fields were missing, which is
# unusable when "field absent" is how this schema spells "unknown" everywhere
# else. Extracted first among the detection-adjacent fields because every search
# that cares about verdicts has to branch on it.
[xaidr_openA2A_event_type]
REGEX = "gen_ai\.security\.event_type"\s*:\s*"([^"]*)"
FORMAT = xaidr_event_type::$1

[xaidr_openA2A_timestamp]
REGEX = "gen_ai\.security\.timestamp"\s*:\s*"([^"]*)"
FORMAT = xaidr_timestamp::$1

[xaidr_openA2A_agent_id]
REGEX = "gen_ai\.agent\.id"\s*:\s*"([^"]*)"
FORMAT = xaidr_agent_id::$1

[xaidr_openA2A_tool_name]
REGEX = "gen_ai\.tool\.name"\s*:\s*"([^"]*)"
FORMAT = xaidr_tool_name::$1

# ── detection ────────────────────────────────────────────────────────────────
[xaidr_openA2A_detection]
REGEX = "gen_ai\.security\.detection\.action"\s*:\s*"([^"]*)"
FORMAT = xaidr_action::$1

[xaidr_openA2A_score]
REGEX = "gen_ai\.security\.detection\.score"\s*:\s*(-?[0-9]+(?:\.[0-9]+)?)
FORMAT = xaidr_score::$1

[xaidr_openA2A_category]
REGEX = "gen_ai\.security\.detection\.category"\s*:\s*"([^"]*)"
FORMAT = xaidr_category::$1

[xaidr_openA2A_severity]
REGEX = "gen_ai\.security\.detection\.severity"\s*:\s*"([^"]*)"
FORMAT = xaidr_severity::$1

[xaidr_openA2A_message]
REGEX = "gen_ai\.security\.detection\.message"\s*:\s*"([^"]*)"
FORMAT = xaidr_message::$1

[xaidr_openA2A_enforcement_mode]
REGEX = "gen_ai\.security\.detection\.enforcement_mode"\s*:\s*"([^"]*)"
FORMAT = xaidr_enforcement_mode::$1

[xaidr_openA2A_latency]
REGEX = "gen_ai\.security\.detection\.latency_ms"\s*:\s*(-?[0-9]+(?:\.[0-9]+)?)
FORMAT = xaidr_latency_ms::$1

[xaidr_openA2A_degraded]
REGEX = "gen_ai\.security\.detection\.degraded"\s*:\s*(true|false)
FORMAT = xaidr_degraded::$1

[xaidr_openA2A_error_type]
REGEX = "gen_ai\.security\.detection\.error_type"\s*:\s*"([^"]*)"
FORMAT = xaidr_error_type::$1

# rules is an ARRAY, and turning it into a multivalue field takes two stages.
#
# A single key-anchored regex with MV_ADD cannot do it: MV_ADD re-runs the regex
# from the end of the previous match, and the key it anchors on appears exactly
# once, so the second pass has nothing to anchor to and only the first rule name
# is ever captured. That is a silent truncation - the field looks populated and
# is missing every rule after the first - so it is worth being explicit about.
#
# Stage 1 captures the array text into an intermediate field. Stage 2 sets
# SOURCE_KEY to that field, so its repeated match sees only the array and every
# quoted string inside it is a rule name by construction. Nothing from elsewhere
# on the line can leak in.
#
# [^\]]* is safe here: rule names are identifiers (LLM01_direct_override,
# destroy.sensitive_path, policy:no-data-export) and none of the 25 emitted by
# the ruleset contains a bracket, a quote or a backslash.
#
# props.conf lists these two in order. Stage 2 depends on stage 1 having run.
[xaidr_openA2A_rules_raw]
REGEX = "gen_ai\.security\.detection\.rules"\s*:\s*(\[[^\]]*\])
FORMAT = xaidr_rules_raw::$1

[xaidr_openA2A_rules]
SOURCE_KEY = xaidr_rules_raw
REGEX = "([^"]+)"
FORMAT = xaidr_rules::$1
MV_ADD = true

# ── interaction ──────────────────────────────────────────────────────────────
[xaidr_openA2A_interaction]
REGEX = "gen_ai\.security\.interaction\.type"\s*:\s*"([^"]*)"
FORMAT = xaidr_interaction_type::$1

[xaidr_openA2A_direction]
REGEX = "gen_ai\.security\.interaction\.direction"\s*:\s*"([^"]*)"
FORMAT = xaidr_direction::$1

[xaidr_openA2A_destination_type]
REGEX = "gen_ai\.security\.interaction\.destination_type"\s*:\s*"([^"]*)"
FORMAT = xaidr_destination_type::$1

[xaidr_openA2A_destination_id]
REGEX = "gen_ai\.security\.interaction\.destination_id"\s*:\s*"([^"]*)"
FORMAT = xaidr_destination_id::$1

[xaidr_openA2A_content_hash]
REGEX = "gen_ai\.security\.interaction\.content_hash"\s*:\s*"([^"]*)"
FORMAT = xaidr_content_hash::$1

[xaidr_openA2A_content_length]
REGEX = "gen_ai\.security\.interaction\.content_length"\s*:\s*(-?[0-9]+)
FORMAT = xaidr_content_length::$1

# ── authz ────────────────────────────────────────────────────────────────────
[xaidr_openA2A_authz]
REGEX = "gen_ai\.security\.authz\.decision"\s*:\s*"([^"]*)"
FORMAT = xaidr_authz_decision::$1

[xaidr_openA2A_authz_policy]
REGEX = "gen_ai\.security\.authz\.policy_id"\s*:\s*"([^"]*)"
FORMAT = xaidr_authz_policy_id::$1

[xaidr_openA2A_impact_class]
REGEX = "gen_ai\.security\.authz\.impact_class"\s*:\s*"([^"]*)"
FORMAT = xaidr_impact_class::$1

[xaidr_openA2A_impact_tier]
REGEX = "gen_ai\.security\.authz\.impact_tier"\s*:\s*"([^"]*)"
FORMAT = xaidr_impact_tier::$1

# ── nano (the optional ML signal) ────────────────────────────────────────────
# nano_calibrated is extracted deliberately and travels beside the score. The
# emitter attaches it because the reading is a detection signal and NOT
# calibrated confidence, and a SIEM is precisely where somebody sorts an alert
# queue by whatever number is to hand. Keep the flag next to the value in any
# dashboard that surfaces xaidr_nano_score.
[xaidr_openA2A_nano]
REGEX = "gen_ai\.security\.detection\.nano_score"\s*:\s*(-?[0-9]+(?:\.[0-9]+)?)
FORMAT = xaidr_nano_score::$1

[xaidr_openA2A_nano_raw]
REGEX = "gen_ai\.security\.detection\.nano_raw"\s*:\s*(-?[0-9]+(?:\.[0-9]+)?)
FORMAT = xaidr_nano_raw::$1

[xaidr_openA2A_nano_calibrated]
REGEX = "gen_ai\.security\.detection\.nano_calibrated"\s*:\s*(true|false)
FORMAT = xaidr_nano_calibrated::$1

# ── provenance ───────────────────────────────────────────────────────────────
[xaidr_openA2A_provenance]
REGEX = "gen_ai\.security\.provenance\.on_behalf_of"\s*:\s*"([^"]*)"
FORMAT = xaidr_on_behalf_of::$1

[xaidr_openA2A_prov_actor]
REGEX = "gen_ai\.security\.provenance\.actor"\s*:\s*"([^"]*)"
FORMAT = xaidr_actor::$1

[xaidr_openA2A_prov_origin]
REGEX = "gen_ai\.security\.provenance\.origin_agent"\s*:\s*"([^"]*)"
FORMAT = xaidr_origin_agent::$1

[xaidr_openA2A_prov_correlation]
REGEX = "gen_ai\.security\.provenance\.correlation_id"\s*:\s*"([^"]*)"
FORMAT = xaidr_correlation_id::$1

[xaidr_openA2A_prov_depth]
REGEX = "gen_ai\.security\.provenance\.delegation_depth"\s*:\s*(-?[0-9]+)
FORMAT = xaidr_delegation_depth::$1

# ── circuit breaker (schema 0.2.0) ───────────────────────────────────────────
# A breaker record is a state transition of the sensor, not a verdict on a
# message: no action, no score, no category, no rules. These attributes are the
# whole of its payload.
#
# Before 0.2.0 the mapper dropped every one of them and a breaker event reached
# a SIEM as five fields with no way to tell it from a scan that had gone empty,
# which is why the field names below have no counterpart in this add-on's 1.0.0
# release: there was nothing to extract.
#
# A DISABLED TRIGGER IS ABSENT, NOT ZERO. The emitter omits a threshold whose
# trigger is switched off, because an absent attribute already means "unknown"
# in this schema and a null is what a chart reads as zero. So an empty
# xaidr_breaker_rate_threshold means the rate trigger is off, not that it is set
# to nothing. Do not fillnull these.

[xaidr_openA2A_breaker]
REGEX = "gen_ai\.security\.circuit_breaker\.transition"\s*:\s*"([^"]*)"
FORMAT = xaidr_breaker_transition::$1

# A trip records why it opened; a close records the reason it HAD been open. The
# mapper collapses both onto this one attribute so a close joins back to its
# trip on equal values.
[xaidr_openA2A_breaker_reason]
REGEX = "gen_ai\.security\.circuit_breaker\.reason"\s*:\s*"([^"]*)"
FORMAT = xaidr_breaker_reason::$1

# close only: manual_reset | cooldown_elapsed. The difference between an
# incident a human handled and one that timed out unattended.
[xaidr_openA2A_breaker_close_method]
REGEX = "gen_ai\.security\.circuit_breaker\.close_method"\s*:\s*"([^"]*)"
FORMAT = xaidr_breaker_close_method::$1

[xaidr_openA2A_breaker_violations]
REGEX = "gen_ai\.security\.circuit_breaker\.violations"\s*:\s*(-?[0-9]+)
FORMAT = xaidr_breaker_violations::$1

[xaidr_openA2A_breaker_tool_calls]
REGEX = "gen_ai\.security\.circuit_breaker\.tool_calls"\s*:\s*(-?[0-9]+)
FORMAT = xaidr_breaker_tool_calls::$1

[xaidr_openA2A_breaker_violation_threshold]
REGEX = "gen_ai\.security\.circuit_breaker\.violation_threshold"\s*:\s*(-?[0-9]+)
FORMAT = xaidr_breaker_violation_threshold::$1

[xaidr_openA2A_breaker_rate_threshold]
REGEX = "gen_ai\.security\.circuit_breaker\.rate_threshold"\s*:\s*(-?[0-9]+)
FORMAT = xaidr_breaker_rate_threshold::$1

[xaidr_openA2A_breaker_cooldown_sec]
REGEX = "gen_ai\.security\.circuit_breaker\.cooldown_sec"\s*:\s*(-?[0-9]+(?:\.[0-9]+)?)
FORMAT = xaidr_breaker_cooldown_sec::$1

# ── trace context (schema 0.2.0) ─────────────────────────────────────────────
# trace_id / span_id / trace_flags are emitted TOP-LEVEL and undotted, matching
# the OpenTelemetry log data model instead of being re-minted under
# gen_ai.security.*, so a consumer already joining on them does not have to
# special-case this producer. They are extracted to xaidr_* names anyway so a
# search works identically against the native shape, which nests the same facts
# under data.traceParent.
#
# The (?:^|,) anchor is load-bearing: "trace_id" is a substring of nothing else
# here, but "span_id" would otherwise match inside a hypothetical
# "parent_span_id", and anchoring on the start of a JSON member costs nothing.

[xaidr_openA2A_trace_id]
REGEX = (?:^\{|,)\s*"trace_id"\s*:\s*"([^"]*)"
FORMAT = xaidr_trace_id::$1

[xaidr_openA2A_span_id]
REGEX = (?:^\{|,)\s*"span_id"\s*:\s*"([^"]*)"
FORMAT = xaidr_span_id::$1

[xaidr_openA2A_trace_flags]
REGEX = (?:^\{|,)\s*"trace_flags"\s*:\s*"([^"]*)"
FORMAT = xaidr_trace_flags::$1

# wire | otel. This one IS under our namespace: how the parent context was
# obtained is an xaidr observation about the context, not part of the W3C
# context itself, and there is no standard attribute for it.
[xaidr_openA2A_trace_source]
REGEX = "gen_ai\.security\.trace\.source"\s*:\s*"([^"]*)"
FORMAT = xaidr_trace_source::$1
