#
# props.conf - TA-xaidr
#
# Two sourcetypes, because xaidr emits two genuinely different documents and a
# single sourcetype would have to guess which one it was looking at:
#
#   xaidr:json     the native shape. {"type","agentId","data":{...}}. Nested.
#   xaidr:openA2A  the mapped shape, Sensor(schema="openA2A"). Flat, and every
#                  key is a dotted OTel attribute name, e.g.
#                  "gen_ai.security.detection.action".
#
# They share not one field name. Aliasing both onto a common xaidr_* namespace
# is most of what this file does, so a search written once works against either.
#
# TARGETS xaidr SCHEMA 0.2.0. Three things changed under this add-on and all
# three are visible here:
#   * both shapes now carry a scan-time timestamp, RFC 3339 UTC with
#     MICROSECONDS. The native shape had no time field at all before, and the
#     openA2A one was minted at MAP time (in the flush worker, up to 5 s late,
#     with a whole batch sharing a stamp) and only to whole seconds.
#   * the mapped shape gained gen_ai.security.event_type, so a circuit-breaker
#     record is no longer indistinguishable from a scan with missing fields.
#   * circuit_breaker.* and the OTel trace fields survive the mapping.
# Reading data emitted by an older xaidr? See "PRE-0.2.0 DATA" at the foot of
# this file.
#
# A NOTE ON BREAKER RECORDS AND EVERY SEARCH IN THIS FILE. A circuit_breaker
# record has no action, no score, no category and no rules: it is a state
# transition of the sensor, not a verdict on a message. The xaidr_is_* fields
# below are therefore keyed on xaidr_action, which a breaker record does not
# have, and eventtypes.conf scopes the verdict-shaped classes on
# xaidr_event_type explicitly rather than relying on that absence. Both are
# deliberate; see the header of eventtypes.conf for the argument.
#
# Both are line-delimited JSON (FileReporter writes one compact object per line
# with json.dumps(separators=(",",":"))), so the event breaking below is exact
# rather than heuristic.
#
# WHY SEARCH-TIME (KV_MODE) AND NOT INDEXED_EXTRACTIONS:
#   * INDEXED_EXTRACTIONS is index-time. It has to be deployed to whichever tier
#     parses the data, and it does not apply to anything already indexed, so a
#     fix ships as a re-index rather than as a config push.
#   * It writes every key into the tsidx. These events carry 25-45 populated
#     fields each, several of which (nanoNote, delegation_chain) are long and
#     low-cardinality-per-search. That is real index growth for fields most
#     searches never touch.
#   * Its payoff is tstats and accelerated data models. This TA deliberately
#     ships no data model and no CIM mapping (see README, "Not CIM-mapped"), so
#     there is nothing here to accelerate and nothing to pay for.
#   * The openA2A keys contain literal '.' characters. Index-time JSON parsing
#     of dotted keys is exactly where field naming is least predictable, and an
#     index-time mistake is not reversible without a re-index.
# If a deployment later needs tstats over these events, INDEXED_EXTRACTIONS=json
# on the forwarder is a supported change; it is not the right default.
#

# ─────────────────────────────────────────────────────────────────────────────
# NATIVE SHAPE
# ─────────────────────────────────────────────────────────────────────────────
[xaidr:json]
description = xaidr agent-security telemetry, native JSON shape (JSONL, one event per line)
category = Application
pulldown_type = 1
disabled = false

SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
MAX_EVENTS = 1

# THE NATIVE SHAPE NOW CARRIES A REAL TIMESTAMP, so DATETIME_CONFIG = CURRENT is
# gone. It was correct while the shape had no time field: receipt time honestly
# labelled beats Splunk's auto-timestamp latching onto a hash fragment or a
# promptLength and silently back-dating the event. It is wrong now, because it
# would throw away a better answer the event is carrying.
#
# data.timestamp is stamped by the sensor at the moment the event is created,
# which is what "when did this happen" means for a scan. Anchoring on the key
# keeps the digit runs elsewhere in the line out of reach. \s* around the colon
# because the emitter writes compact JSON but a collector in the middle may
# re-serialise with spaces.
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
# 27 characters of timestamp (2026-09-01T22:41:26.766832Z) plus headroom.
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

KV_MODE = json
AUTO_KV_JSON = true

# Friendly names. Source names are quoted because they contain '.' - the JSON
# extractor names nested keys by their path, so data.action really is a field
# whose name contains a dot.
FIELDALIAS-xaidr_envelope = "type" AS xaidr_event_type "agentId" AS xaidr_agent_id
FIELDALIAS-xaidr_ids = "data.scanId" AS xaidr_scan_id "data.eventId" AS xaidr_event_id "data.agentId" AS xaidr_agent_id_data
FIELDALIAS-xaidr_verdict = "data.action" AS xaidr_action "data.score" AS xaidr_score "data.category" AS xaidr_category "data.rules{}" AS xaidr_rules
FIELDALIAS-xaidr_context = "data.direction" AS xaidr_direction "data.enforcementMode" AS xaidr_enforcement_mode "data.scanTimeMs" AS xaidr_latency_ms
FIELDALIAS-xaidr_content = "data.promptHash" AS xaidr_content_hash "data.promptLength" AS xaidr_content_length
FIELDALIAS-xaidr_dest = "data.destinationType" AS xaidr_destination_type "data.destinationIdentifier" AS xaidr_destination_id "data.destinationAgent" AS xaidr_destination_agent "data.toolName" AS xaidr_tool_name "data.mcpServer" AS xaidr_mcp_server
FIELDALIAS-xaidr_authz = "data.impactClass" AS xaidr_impact_class "data.impactTier" AS xaidr_impact_tier "data.authzDecision" AS xaidr_authz_decision "data.authzPolicyId" AS xaidr_authz_policy_id
FIELDALIAS-xaidr_tiers = "data.privilegeTier" AS xaidr_privilege_tier "data.privilegeTierConfigured" AS xaidr_privilege_tier_configured "data.leastPrivilegedTier" AS xaidr_least_privileged_tier "data.delegated" AS xaidr_delegated "data.chainTiers{}" AS xaidr_chain_tiers
FIELDALIAS-xaidr_degraded = "data.degraded" AS xaidr_degraded "data.errorType" AS xaidr_error_type
FIELDALIAS-xaidr_nano = "data.nanoScore" AS xaidr_nano_score "data.nanoRaw" AS xaidr_nano_raw "data.nanoCalibrated" AS xaidr_nano_calibrated "data.nanoNote" AS xaidr_nano_note "data.nanoRuntime" AS xaidr_nano_runtime "data.nanoFigureStatus" AS xaidr_nano_figure_status "data.nanoFpRange" AS xaidr_nano_fp_range "data.nanoFpApplies" AS xaidr_nano_fp_applies
FIELDALIAS-xaidr_prov = "data.provenance.on_behalf_of" AS xaidr_on_behalf_of "data.provenance.actor" AS xaidr_actor "data.provenance.origin_agent" AS xaidr_origin_agent "data.provenance.correlation_id" AS xaidr_correlation_id "data.provenance.delegation_depth" AS xaidr_delegation_depth
FIELDALIAS-xaidr_time = "data.timestamp" AS xaidr_timestamp
FIELDALIAS-xaidr_trace = "data.traceParent.traceId" AS xaidr_trace_id "data.traceParent.spanId" AS xaidr_span_id "data.traceParent.traceFlags" AS xaidr_trace_flags "data.traceParent.source" AS xaidr_trace_source

# BREAKER FIELDS, NAMED TO MATCH THE MAPPED SHAPE. The native event calls the
# trip/close discriminator `event` and the close method `how`; the mapped shape
# calls them `transition` and `close_method`. One name each wins here, and it is
# the mapped one, because that vocabulary is the published schema and a search
# should not have to know which serialisation it is reading.
#
# `reason` is not aliased directly: see the EVAL below.
FIELDALIAS-xaidr_breaker = "data.event" AS xaidr_breaker_transition "data.tripReason" AS xaidr_breaker_trip_reason "data.how" AS xaidr_breaker_close_method "data.violations" AS xaidr_breaker_violations "data.toolCalls" AS xaidr_breaker_tool_calls "data.violationThreshold" AS xaidr_breaker_violation_threshold "data.rateThreshold" AS xaidr_breaker_rate_threshold "data.cooldownSec" AS xaidr_breaker_cooldown_sec

EVAL-xaidr_shape = "native"

# A trip records why it opened in `reason`; a close records the reason it HAD
# been open in `tripReason`. Same fact about the same episode, and the mapped
# shape already collapses them onto one attribute, so the native side does the
# same. A consumer joining a close back to its trip compares equal values
# instead of two differently-named fields. The raw tripReason stays available
# above for anyone who wants the distinction.
EVAL-xaidr_breaker_reason = coalesce('data.reason', 'data.tripReason')

# "Catch" as the project defines it: blocked OR flagged. Both emit a scored,
# logged event; counting only blocks confuses "we stopped it" with "we saw it".
# Encoded once here so a dashboard does not re-derive it three different ways.
#
# Keyed on the action and NOT on xaidr_event_type on purpose. A breaker record
# has no action, so it cannot be a catch by construction, and that holds for
# pre-0.2.0 events too, which carry no event_type to test. Making the eventtypes
# state the discriminator and leaving this one keyed on the fact it is actually
# about is more robust than doing it the other way round.
EVAL-xaidr_is_catch = if(xaidr_action=="blocked" OR xaidr_action=="flagged", 1, 0)
EVAL-xaidr_is_halting = if(xaidr_action=="blocked" OR xaidr_action=="approval_required", 1, 0)

# ─────────────────────────────────────────────────────────────────────────────
# OPENA2A MAPPED SHAPE
# ─────────────────────────────────────────────────────────────────────────────
[xaidr:openA2A]
description = xaidr agent-security telemetry, openA2A gen_ai.security.* shape (JSONL, one event per line)
category = Application
pulldown_type = 1
disabled = false

SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
MAX_EVENTS = 1

# gen_ai.security.timestamp, RFC 3339 UTC with MICROSECONDS. Under schema 0.1.0
# this was whole seconds and was minted at map time; both changed in 0.2.0, so
# the format string changed with them. %6N is Splunk's six-digit subsecond
# specifier.
#
# Anchor on the key so nothing else in the line can be mistaken for it. \s* on
# both sides of the colon because the emitter writes compact JSON but a
# collector in the middle may re-serialise with spaces.
TIME_PREFIX = "gen_ai\.security\.timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
# 27 characters of timestamp (2026-09-01T22:41:26.766832Z) plus headroom.
MAX_TIMESTAMP_LOOKAHEAD = 32
TZ = UTC

KV_MODE = json
AUTO_KV_JSON = true

# The regex extractions in transforms.conf are the load-bearing path here, not
# a fallback. Every key in this shape contains literal dots, and a dotted key is
# the one case where "what does the JSON extractor name this field" is not
# something this TA can settle without a Splunk instance to test on. The
# transforms match the raw text and are therefore correct either way; the
# FIELDALIAS block below is the convenience path and is allowed to be redundant.
REPORT-xaidr_openA2A_envelope = xaidr_openA2A_envelope, xaidr_openA2A_schema_version, xaidr_openA2A_event_type, xaidr_openA2A_timestamp, xaidr_openA2A_agent_id, xaidr_openA2A_tool_name
REPORT-xaidr_openA2A_detection = xaidr_openA2A_detection, xaidr_openA2A_score, xaidr_openA2A_category, xaidr_openA2A_severity, xaidr_openA2A_message, xaidr_openA2A_enforcement_mode, xaidr_openA2A_latency, xaidr_openA2A_degraded, xaidr_openA2A_error_type
# Order matters: xaidr_openA2A_rules reads the field xaidr_openA2A_rules_raw
# writes, via SOURCE_KEY. See the comment on those stanzas in transforms.conf.
REPORT-xaidr_openA2A_rules = xaidr_openA2A_rules_raw, xaidr_openA2A_rules
REPORT-xaidr_openA2A_interaction = xaidr_openA2A_interaction, xaidr_openA2A_direction, xaidr_openA2A_destination_type, xaidr_openA2A_destination_id, xaidr_openA2A_content_hash, xaidr_openA2A_content_length
REPORT-xaidr_openA2A_authz = xaidr_openA2A_authz, xaidr_openA2A_authz_policy, xaidr_openA2A_impact_class, xaidr_openA2A_impact_tier
REPORT-xaidr_openA2A_nano = xaidr_openA2A_nano, xaidr_openA2A_nano_raw, xaidr_openA2A_nano_calibrated
REPORT-xaidr_openA2A_provenance = xaidr_openA2A_provenance, xaidr_openA2A_prov_actor, xaidr_openA2A_prov_origin, xaidr_openA2A_prov_correlation, xaidr_openA2A_prov_depth
REPORT-xaidr_openA2A_breaker = xaidr_openA2A_breaker, xaidr_openA2A_breaker_reason, xaidr_openA2A_breaker_close_method, xaidr_openA2A_breaker_violations, xaidr_openA2A_breaker_tool_calls, xaidr_openA2A_breaker_violation_threshold, xaidr_openA2A_breaker_rate_threshold, xaidr_openA2A_breaker_cooldown_sec
# trace_id / span_id / trace_flags are emitted TOP-LEVEL and undotted, matching
# the OpenTelemetry log data model rather than being re-minted under
# gen_ai.security.*. That makes them the one part of this shape the JSON
# extractor names unambiguously, but they are extracted here anyway so the
# xaidr_* names exist on both sourcetypes without depending on that.
REPORT-xaidr_openA2A_trace = xaidr_openA2A_trace_id, xaidr_openA2A_span_id, xaidr_openA2A_trace_flags, xaidr_openA2A_trace_source

# Convenience aliases for deployments where the JSON extractor does produce the
# literal dotted field names. Harmless if it does not: an alias whose source
# field is absent is a no-op, and the REPORT extractions above have already set
# the same targets.
FIELDALIAS-xaidr_a2a_core = "gen_ai.agent.id" AS xaidr_agent_id "gen_ai.tool.name" AS xaidr_tool_name "gen_ai.security.detection.rules{}" AS xaidr_rules

EVAL-xaidr_shape = "openA2A"
EVAL-xaidr_is_catch = if(xaidr_action=="blocked" OR xaidr_action=="flagged", 1, 0)
EVAL-xaidr_is_halting = if(xaidr_action=="blocked" OR xaidr_action=="approval_required", 1, 0)

# ─────────────────────────────────────────────────────────────────────────────
# PRE-0.2.0 DATA
# ─────────────────────────────────────────────────────────────────────────────
# Events indexed before the xaidr release that added schema 0.2.0 are shaped
# differently, and this add-on does not pretend otherwise.
#
# openA2A: those events carry a whole-second timestamp, which the %6N format
# above will not parse. Splunk falls back to automatic timestamp recognition,
# which does recognise a bare ISO 8601 string, so the events still land at
# roughly the right time. They carry no gen_ai.security.event_type (all
# xaidr_* breaker fields will be empty), and any circuit-breaker record among
# them is the five-field husk the old mapper produced: it has no reason, no
# counts and no transition, and nothing can recover them because they were never
# written. Nothing here can fix that; it is named so it is not mistaken for a
# parsing failure.
#
# native: those events carry no timestamp at all. TIME_PREFIX will not match, so
# Splunk falls back to automatic recognition, which on this shape has nothing
# date-like to find and may guess badly from a hash fragment or an integer.
#
# NO LEGACY SOURCETYPE IS SHIPPED FOR THIS, deliberately. A clone carrying only
# DATETIME_CONFIG = CURRENT would fix the timestamp and silently drop every
# xaidr_* field, because Splunk has no props inheritance and the native
# extractions are FIELDALIAS entries bound to this stanza. A sourcetype that
# times events correctly and extracts nothing is a worse trap than a documented
# caveat. If a deployment holds meaningful pre-0.2.0 native volume and wants
# honest receipt-time semantics for it, put four lines in a local app:
#
#   [xaidr:json:legacy]
#   DATETIME_CONFIG = CURRENT
#   SHOULD_LINEMERGE = false
#   LINE_BREAKER = ([\r\n]+)
#   KV_MODE = json
#
# and copy the FIELDALIAS / EVAL block above into it. Owning that copy locally
# is the price of the split; this add-on does not pay it on everyone's behalf.
